<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的书桌V1 · Xudong</title><meta name="description" content="从面对设计师到俯视桌面，坐姿到俯视桌面的多视角序列预览。"><style>*{box-sizing:border-box}html{background:#251f18}body{margin:0;color:#fff9ec;font-family:Arial,'PingFang SC',sans-serif}button{font:inherit;cursor:pointer}header{position:fixed;top:0;left:0;right:0;padding:25px 4%;display:flex;justify-content:space-between;align-items:center;z-index:4;background:linear-gradient(#18160f65,transparent);pointer-events:none}header b{font:26px Georgia}header button{background:#f6f0e517;border:1px solid #fff5d84d;color:inherit;border-radius:24px;padding:10px 20px;pointer-events:auto;backdrop-filter:blur(8px)}#journey{height:320vh}.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#b18b61}canvas{display:block;width:100%;height:100%}.title{position:absolute;top:19%;left:6%;max-width:320px;text-shadow:0 2px 25px #241a1290;pointer-events:none}.title small{font-size:10px;letter-spacing:3px}.title h1{font:clamp(46px,6vw,85px)/1.02 Georgia;letter-spacing:-3px;margin:20px 0}.title p{font-size:13px;line-height:1.9}.controls{position:absolute;bottom:0;left:0;right:0;padding:26px 4%;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;background:linear-gradient(transparent,#18160f70);z-index:4}.frame-nav{display:flex;gap:8px}.frame-nav button{border:1px solid #fff6de60;background:#221b1540;color:#fff8ed;border-radius:24px;padding:11px 17px;font-size:12px;backdrop-filter:blur(8px)}.frame-nav button[aria-pressed=true]{background:#f9f0df;color:#372b20;border-color:#f9f0df}.meta{font-size:10px;letter-spacing:1.5px;line-height:1.8}.meta span{display:block;opacity:.8;font-size:10px;letter-spacing:0}.bar{position:absolute;bottom:0;left:0;height:3px;background:#f2e3c3;transform-origin:left;width:100%}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#d3b38e;color:#44 </style></head><body><header><b>xudong.</b><button id="explore">探索桌面 ↗</button></header><main id="journey"><section class="stage"><canvas id="scene" role="img" aria-label="设计师坐在桌后，镜头经斜俯视转向桌面正俯视"></canvas><div class="loading" id="loading">正在准备桌面视角…</div><div class="title" id="intro"><small>A DESIGNER'S POINT OF VIEW</small><h1>Hello.<br>Take a look.</h1><p>我是 Xudong，一名 UX 设计师。<br>向下滚动，探索我的桌面。</p></div><div class="hotspots" id="hotspots" hidden><button class="hotspot" data-id="0" aria-label="查看 Galileo 项目"></button><button class="hotspot" data-id="1" aria-label="查看 Design System 项目"></button><button class="hotspot" data-id="2" aria-label="查看 Experiences 项目"></button><button class="hotspot" data-id="3" aria-label="查看 Notes"></button></div><div class="controls"><nav class="frame-nav" aria-label="关键画面"><button data-frame="0" aria-pressed="true">01 平视</button><button data-frame="1" aria-pressed="false">02 斜俯视</button><button data-frame="2" aria-pressed="false">03 正俯视</button></nav><div class="meta"><strong id="label">FACE TO FACE</strong><span id="frameCount">01 / 24</span><span>24 帧运镜预览 · 滚动探索</span></div></div><div class="bar" id="bar"></div></section></main><dialog id="summary"><button class="close" id="close" aria-label="关闭">×</button><small>ON MY DESK</small><h2 id="projectTitle"></h2><p id="projectText"></p><button id="more">查看详情 ↗</button></dialog><section class="detail" id="detail" hidden><button id="back">← 回到桌面</button><h1 id="detailTitle"></h1><p id="detailText"></p><div class="art" id="art"></div><p>此页面用于确认作品访问路径，完整案例内容待补充。</p></section><script>
const images=Array.from({length:24},()=>new Image()),canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),journey=document.getElementById('journey'),loading=document.getElementById('loading'),buttons=[...document.querySelectorAll('[data-frame]')],hotspots=[...document.querySelectorAll('[data-id]')];let current=0,chosen=0,ready=false,lastRect=null,renderedIndex=-1;const available=new Set();const labels=['FACE TO FACE','A CHANGE OF PERSPECTIVE','ON THE DESK'],projects=[['Galileo','视觉智能与复杂信息的设计探索。','#344b3b'],['Design System','通过一致的设计语言连接产品体验。','#cec7af'],['Experiences','把想法转化为清晰的产品体验。','#b45835'],['Notes','记录思考、观察和未完成的想法。','#2d302d']];
function progress(){return Math.max(0,Math.min(1,scrollY/Math.max(1,journey.offsetHeight-innerHeight)))}
function render(){const p=progress(),requested=Math.round(p*23);current=requested;document.getElementById('frameCount').textContent=String(current+1).padStart(2,'0')+' / 24';document.getElementById('bar').style.transform=`scaleX(${p})`;document.getElementById('intro').hidden=p>.14;document.getElementById('label').textContent=labels[p<.22?0:p<.85?1:2];buttons.forEach((b,i)=>b.setAttribute('aria-pressed',(i===0&&p<.22||i===1&&p>=.22&&p<.85||i===2&&p>=.85)?'true':'false'));document.getElementById('hotspots').hidden=requested!==23||!available.has(23);if(!ready)return;if(!available.has(current))current=[...available].reduce((a,b)=>Math.abs(b-requested)<Math.abs(a-requested)?b:a);const W=canvas.clientWidth,H=canvas.clientHeight,D=Math.min(devicePixelRatio||1,1.5),cw=Math.round(W*D),ch=Math.round(H*D);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;renderedIndex=-1}if(current===renderedIndex)return;renderedIndex=current;ctx.setTransform(D,0,0,D,0,0);const image=images[current],fw=image.naturalWidth,fh=image.naturalHeight,scale=innerWidth<650?Math.min(W/fw,H/fh):Math.max(W/fw,H/fh),w=fw*scale,h=fh*scale,x=(W-w)/2,y=(H-h)/2;ctx.fillStyle='#c29a70';ctx.fillRect(0,0,W,H);ctx.drawImage(image,0,0,fw,fh,x,y,w,h);lastRect={x,y,w,h};const regions=[[.12,.07,.25,.44],[.52,.06,.24,.37],[.37,.48,.28,.41],[.71,.52,.2,.39]];hotspots.forEach((b,i)=>{const r=regions[i];b.style.left=x+w*r[0]+'px';b.style.top=y+h*r[1]+'px';b.style.width=w*r[2]+'px';b.style.height=h*r[3]+'px'})}
let loaded=0;images.forEach((image,i)=>{image.decoding='async';image.onload=async()=>{try{await image.decode()}catch{}available.add(i);loaded++;ready=true;if(available.has(0))loading.hidden=true;renderedIndex=-1;render()};image.onerror=()=>{if(i===0)loading.textContent='开场画面加载失败，请刷新重试。'};image.src='assets/sequence24/frame-'+String(i).padStart(2,'0')+'.jpg'});
let pending=false;addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(()=>{render();pending=false})}},{passive:true});addEventListener('resize',render);function go(i){const max=journey.offsetHeight-innerHeight;scrollTo({top:[0,10/23,1][i]*max,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}buttons.forEach(b=>b.onclick=()=>go(+b.dataset.frame));document.getElementById('explore').onclick=()=>go(2);const dialog=document.getElementById('summary'),detail=document.getElementById('detail');hotspots.forEach(b=>b.onclick=()=>{chosen=+b.dataset.id;document.getElementById('projectTitle').textContent=projects[chosen][0];document.getElementById('projectText').textContent=projects[chosen][1];dialog.showModal()});document.getElementById('close').onclick=()=>dialog.close();document.getElementById('more').onclick=()=>{dialog.close();document.getElementById('detailTitle').textContent=projects[chosen][0];document.getElementById('detailText').textContent=projects[chosen][1];document.getElementById('art').textContent=projects[chosen][0];document.getElementById('art').style.background=projects[chosen][2];detail.hidden=false;document.body.style.overflow='hidden';document.getElementById('back').focus()};document.getElementById('back').onclick=()=>{detail.hidden=true;document.body.style.overflow='';hotspots[chosen].focus()};addEventListener('keydown',e=>{if(e.key==='Escape'&&!detail.hidden)document.getElementById('back').click()});render();
</script></body></html>
